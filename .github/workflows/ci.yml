name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ktfmt format
        run: ./gradlew ktfmtFormat --console=plain

      - name: Commit formatting
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply ktfmt formatting"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Already formatted, nothing to commit."
          fi

      - name: Compile
        run: ./gradlew compileKotlinJvm compileKotlin --continue --console=plain

      - name: Tests
        run: ./gradlew jvmTest test --continue --console=plain

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            app/shared/build/test-results/jvmTest/**/*.xml
            app/shared/build/reports/tests/jvmTest/**
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pockety-screenshots
          path: |
            .screenshots/**/*.png
            design/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Coverage
        run: ./gradlew koverVerify --console=plain

      - name: Detekt
        run: ./gradlew detektMain --console=plain

      - name: Ktfmt check
        run: ./gradlew ktfmtCheck --console=plain

  build-design-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Design Web App
        run: ./gradlew :design:wasmJsBrowserDistribution --console=plain

      - name: Upload Design Web App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-web-app
          path: design/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
