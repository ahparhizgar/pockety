name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileKotlinJvm compileKotlin --continue --console=plain

      - name: Tests
        run: ./gradlew jvmTest test --continue --console=plain

      - name: Coverage
        run: ./gradlew koverVerify --console=plain

      - name: Detekt
        run: ./gradlew detektMain --console=plain

      - name: Ktfmt check
        run: ./gradlew ktfmtCheck --console=plain
