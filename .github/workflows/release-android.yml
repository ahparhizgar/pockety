name: Release Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/android-release.keystore

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PATH: /tmp/android-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:androidApp:assembleRelease --console=plain

      - name: Clean Keystore
        if: always()
        run: rm -f /tmp/android-release.keystore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pockety-release-apk
          path: app/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
