<!doctype html>
<meta charset="utf-8">
<title>Pockety debug launcher icon previews</title>
<style>
  body { font: 16px sans-serif; background: #eceeea; color: #18231b; margin: 2rem; }
  section { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 1rem 0 2rem; }
  figure { margin: 0; text-align: center; }
  img, .adaptive { width: 192px; height: 192px; object-fit: contain; }
  .circle { clip-path: circle(50%); }
  .squircle { clip-path: inset(0 round 25%); }
  .rounded { clip-path: inset(0 round 12%); }
  .mono { width: 192px; height: 192px; display: grid; place-items: center; border-radius: 24%; }
  .mono svg { width: 135px; height: 135px; }
  .light { background: white; color: #151515; }
  .dark { background: #171717; color: white; }
</style>
<h1>Pockety debug launcher previews</h1>
<p>Legacy files are shown at xxxhdpi source size. Adaptive masks use the same square artwork.</p>
<section>
  <figure><img src="../res/mipmap-xxxhdpi/ic_launcher.png"><figcaption>Legacy square · 192 px</figcaption></figure>
  <figure><img class="circle" src="../res/mipmap-xxxhdpi/ic_launcher_round.png"><figcaption>Round · circle mask</figcaption></figure>
  <figure><img class="circle" src="../res/mipmap-xxxhdpi/ic_launcher.png"><figcaption>Adaptive · circle mask</figcaption></figure>
  <figure><img class="squircle" src="../res/mipmap-xxxhdpi/ic_launcher.png"><figcaption>Adaptive · squircle mask</figcaption></figure>
  <figure><img class="rounded" src="../res/mipmap-xxxhdpi/ic_launcher.png"><figcaption>Adaptive · rounded square mask</figcaption></figure>
</section>
<p>Monochrome samples use black on light and white on dark to represent launcher tinting.</p>

  <figure><div class="mono dark"><svg viewBox="0 0 108 108" aria-label="Pocket and bug monochrome icon"><g fill="currentColor"><path d="M37 38h34v18a17 17 0 0 1-34 0z"/><ellipse cx="68" cy="35.5" rx="4" ry="4.5"/></g><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M42 46h16M66 32l-2-2m6 2 2-2m-8 4-3-1m3 4-3 1m10-4 3-1m-3 4 3 1"/></g></svg></div><figcaption>Monochrome · dark tint</figcaption></figure>
</section>
